name: grid-watch
# The fleet's control plane — v2 READ-ONLY law (2026-10-17, owner directive):
# SENSE every repo/workflow/run -> DECIDE health classes -> RECORD the single
# public truth file (state/fleet-health.json), double-pass verified.
# NO mutation: auto-retry and re-enable were removed — a monitor observes,
# it does not act. Mutations belong to the owner's explicit decisions.
# Cadence 30min -> every 6h (4 runs/day ≈ ~12 Actions-minutes/month for the
# whole fleet's single truth source) + on-demand workflow_dispatch.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grid-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: SENSE -> DECIDE -> RECORD (read-only)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node grid-watch.mjs
